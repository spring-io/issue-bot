plugins {
	id "checkstyle"
	id "java"
	id "io.spring.javaformat" version "0.0.48"
	id "org.springframework.boot" version "4.1.2"
}

group = "io.spring.issuebot"

repositories {
	mavenCentral()
}

dependencies {
	annotationProcessor(platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES))
	annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")

	implementation(platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES))
	implementation("org.apache.httpcomponents.client5:httpclient5")
	implementation("org.springframework.boot:spring-boot-starter-restclient")
	implementation("org.springframework.boot:spring-boot-starter-webmvc")

	runtimeOnly(platform('com.azure.spring:spring-cloud-azure-dependencies:7.4.0'))
	runtimeOnly('com.azure.spring:spring-cloud-azure-starter-keyvault-secrets') {
		exclude(group: 'jakarta.validation', module: 'jakarta.validation-api')
	}

	testImplementation("org.springframework.boot:spring-boot-starter-test")
}

checkstyle {
	toolVersion = "12.3.1"
}

java {
	sourceCompatibility = "17"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}
